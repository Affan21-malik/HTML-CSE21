<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Boxes</title>
    <style>
        .container {
            font-size: 0;
            text-align: center;
        }

        .box {
            display: inline-block;
            border: 2px solid black;
            padding: 10px; 
            box-sizing: border-box;
            width: 24%; 
            font-size: 16px;
            background-color: #d1e7dd;
            margin: 2px; 
            border-radius: 8px;
        }

        .box span {
            display: block;
            margin-top: 8px;
            color: #555;
        }

        @media (max-width: 600px) {
            .box {
                width: 100%;
            }
        }

        @media (min-width: 601px) and (max-width: 900px) {
            .box {
                width: 48%;
            }
        }

        @media (min-width: 901px) {
            .box {
                width: 24%;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="box">Mohd Affan <span>CSE 21</span></div>
        <div class="box">Faraz <span>AIML</span></div>
        <div class="box">Nitin <span>CSE 22</span></div>
        <div class="box">Anas <span>CSE 21</span></div>
    </div>

</body>
</html>
